<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090b14" />
  <meta name="description" content="FreeTV — a modern directory for free, publicly available live TV streams." />
  <title>FreeTV — Live channels, freely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar shell">
    <a class="brand" href="#" aria-label="FreeTV home"><span class="brand-mark"><i></i><i></i><i></i></span><span>Free<span class="brand-accent">TV</span></span></a>
    <div class="top-actions"><span class="live-dot"></span><span class="live-label">Live directory</span><button class="icon-button" id="themeButton" title="Toggle theme" aria-label="Toggle theme">◐</button></div>
  </header>

  <main class="shell">
    <section class="hero" aria-hidden="true"></section>

    <section class="player-layout">
      <div class="player-card">
        <div class="video-wrap" id="videoWrap">
          <div class="video-placeholder" id="videoPlaceholder"><div class="play-orb">▶</div><p>Select a channel to start watching</p><small>Streams open in your browser</small></div>
          <video id="video" controls playsinline></video>
        </div>
        <div class="now-playing">
          <div><span class="kicker">NOW PLAYING</span><h2 id="nowTitle">Choose a channel</h2><p id="nowMeta">Your selected stream will appear here</p></div>
          <button class="share-button" id="shareButton" title="Copy stream link">↗ <span>Share</span></button>
        </div>
      </div>
      <aside class="quick-panel"><div class="panel-heading"><span>Quick picks</span><button id="randomButton">Surprise me <b>↗</b></button></div><div id="quickPicks" class="quick-list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></aside>
    </section>

    <section class="catalog">
      <div class="catalog-head">
        <div class="catalog-tools">
          <label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Search channels..." autocomplete="off" /></label>
          <label class="country-filter"><select id="countrySelect" aria-label="Filter by country"><option value="">All countries</option></select></label>
        </div>
      </div>
      <div id="genreChips" class="chips" aria-label="Channel categories"><button class="chip active" data-genre="">All</button></div>
      <div class="channel-list-scroll" id="channelListScroll">
        <div id="channelGrid" class="channel-grid"><div class="empty-state">Loading the channel guide<span class="loader"></span></div></div>
        <div class="load-more-wrap"><button class="load-more" id="loadMore">Load more channels <span>↓</span></button></div>
      </div>
    </section>
  </main>

  <footer class="shell footer"><span>FreeTV</span><span>Powered by the <a href="https://github.com/iptv-org/iptv" target="_blank" rel="noreferrer">iptv-org</a> community</span><span>Free and open web streams</span></footer>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
