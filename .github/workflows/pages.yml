name: Deploy FreeTV to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload one Pages artifact for this run
        uses: actions/upload-pages-artifact@v3
        with:
          name: freetv-pages-${{ github.run_id }}
          path: .

      - name: Deploy the matching Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: freetv-pages-${{ github.run_id }}
